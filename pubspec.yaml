name: pinlogy
description: "SNSで見つけた場所を、投稿ごと自分のマップに残すFlutterアプリ"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  collection: ^1.19.1
  google_fonts: ^6.2.1
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  http: ^1.6.0
  google_mlkit_text_recognition: ^0.16.0
  share_plus: ^13.3.0
  image_picker: ^1.2.3
  app_links: ^7.0.0
  supabase_flutter: ^2.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/place_fallback.webp
